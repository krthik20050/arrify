    <text x="0" y="123" fill="#f8f8f2" font-family="Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-3">Meet Arrify.</text>
    <text x="3" y="171" fill="#eaf45d" font-family="Arial,sans-serif" font-size="25" font-weight="600">Find it. Try it in your space.</text>
    <text x="3" y="215" fill="#c5cabb" font-family="Arial,sans-serif" font-size="17">A playful sticker shop with 3D previews and phone AR.</text>
    <g transform="translate(4 270)" font-family="Arial,sans-serif" font-size="13" font-weight="700">
      <rect width="118" height="34" rx="17" fill="#343a2d"/><text x="59" y="22" text-anchor="middle" fill="#f8f8f2">4.4k+ DESIGNS</text>
      <rect x="130" width="108" height="34" rx="17" fill="#343a2d"/><text x="184" y="22" text-anchor="middle" fill="#f8f8f2">3D PREVIEW</text>
      <rect x="250" width="89" height="34" rx="17" fill="#343a2d"/><text x="294" y="22" text-anchor="middle" fill="#f8f8f2">PHONE AR</text>
    </g>
  </g>
  <g filter="url(#shadow)" transform="translate(620 80) rotate(-7 200 145)">
