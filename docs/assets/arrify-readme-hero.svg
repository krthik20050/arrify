<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Arrify — find your sticker, see it in your space</title>
  <desc id="description">A dark editorial banner with bright sticker shapes, a laptop mockup, and a phone showing a sticker placement preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a16"/><stop offset="1" stop-color="#252a21"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf45d" stop-opacity=".25"/><stop offset="1" stop-color="#eaf45d" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#080a08" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="935" cy="205" r="300" fill="url(#glow)"/>
  <circle cx="1100" cy="55" r="3" fill="#f6f7e9" opacity=".55"/><circle cx="1068" cy="88" r="2" fill="#f6f7e9" opacity=".35"/>
  <g transform="translate(74 70)">
